# Bina APK Kediaman Isekai Waguri (pembalut WebView) — hanya bila folder isekai-waguri berubah, atau dijalankan secara manual.
name: Isekai Waguri APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'isekai-waguri/**'
      - '.github/workflows/isekai-waguri-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: isekai-waguri
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Android SDK sudah dipasang pada pelari ubuntu-latest (ANDROID_HOME); AGP memuat turun platform yang tiada.
      - name: Semak Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Bina game satu fail (dist/)
        run: node tools/build.mjs
      - name: Bina APK debug
        working-directory: isekai-waguri/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: KediamanIsekaiWaguri-v19-debug-apk
          path: isekai-waguri/android/app/build/outputs/apk/debug/*.apk
